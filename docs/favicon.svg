<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Linkd">
  <!-- Favicon: the overlap mark on a cream rounded tile so it stays legible on
       any browser-tab background (light or dark). -->
  <rect width="32" height="32" rx="7.5" fill="#F2EEE3"/>
  <defs>
    <clipPath id="lensFav"><circle cx="12" cy="16.5" r="6.7"/></clipPath>
  </defs>
  <circle cx="12" cy="16.5" r="6.7" fill="#4A5D43"/>
  <circle cx="20" cy="16.5" r="6.7" fill="#4A5D43"/>
  <circle cx="20" cy="16.5" r="6.7" fill="#B5694A" clip-path="url(#lensFav)"/>
</svg>
