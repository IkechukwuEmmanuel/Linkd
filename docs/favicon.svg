<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Linkd">
  <!-- Favicon: the overlap mark on a cream rounded tile so it stays legible on
       any browser-tab background. Strokes are thickened and the circles pulled
       closer for clarity at 16px; the clay swirl in the lens reads as a single
       mark at tiny sizes and as a spiral when scaled up. -->
  <rect width="32" height="32" rx="7.5" fill="#F2EEE3"/>
  <g fill="none" stroke="#4A5D43" stroke-width="2.6">
    <circle cx="12.5" cy="16.5" r="6.6"/>
    <circle cx="19.5" cy="16.5" r="6.6"/>
  </g>
  <path d="M16 13.4 a 2.5 2.5 0 1 1 -2.3 3.4 a 1.25 1.25 0 1 1 1.9 -1.3"
        fill="none" stroke="#B5694A" stroke-width="1.7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
