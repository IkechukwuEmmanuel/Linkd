<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Linkd">
  <!-- Linkd mark: two intersecting circles (the product's overlapping-contact
       motif), with an abstract spiral set in the shared lens to suggest mind and
       memory. Moss rings, clay swirl, on a cream surface. Two colours only.
       At 16px it reads as two circles with a mark in the middle; the spiral
       resolves into a clear swirl only at larger sizes. -->
  <g fill="none" stroke="#4A5D43" stroke-width="2.4">
    <circle cx="12" cy="16" r="7.6"/>
    <circle cx="20" cy="16" r="7.6"/>
  </g>
  <path d="M16 12.6 a 3 3 0 1 1 -2.8 4.1 a 1.5 1.5 0 1 1 2.3 -1.6"
        fill="none" stroke="#B5694A" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
