# Heap capped at 4 GiB. The previous -Xmx8G claimed the entire heap on an 8 GiB
# machine and got the Gradle daemon OOM-killed; 4 GiB builds fine on >=16 GiB
# hosts. Kotlin compiles in-process to avoid spawning a second ~1.5 GiB JVM.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
